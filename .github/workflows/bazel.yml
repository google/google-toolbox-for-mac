name: Bazel

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'AppKit/**'
      - 'DebugUtils/**'
      - 'Foundation/**'
      - 'Resources/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'UnitTesting/**'
      - 'iPhone/**'
      - 'BUILD'
      - 'MODULE.bazel'
      - '.bazelc'
      - '.bazelversion'
      - '.github/workflows/bazel.yml'
      - 'bazel_support/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'AppKit/**'
      - 'DebugUtils/**'
      - 'Foundation/**'
      - 'Resources/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'UnitTesting/**'
      - 'iPhone/**'
      - 'BUILD'
      - 'MODULE.bazel'
      - '.bazelc'
      - '.bazelversion'
      - '.github/workflows/bazel.yml'
      - 'bazel_support/**'
  schedule:
    # Run the first and fifteenth of every month at 4:10 UTC
    - cron:  '10 4 1,15 * *'
  # Also allow manual triggering from the github UX to revalidate things.
  workflow_dispatch:

jobs:
  bazel:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        MODE: ["dbg", "opt"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        bazelisk-cache: true
        repository-cache: true
    - name: Boot iOS Simulator
      run: |
        bazelisk run @build_bazel_rules_apple//apple/testing/default_runner:simulator_creator -- \
          --device-type='iPhone 17' \
          --sdk-version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
    - name: bazel test
      run: |
        bazelisk \
          test \
          --build_tests_only \
          --test_output=errors \
          -c "${{ matrix.MODE }}" \
          --ios_simulator_device='iPhone 17' \
          //...
